name: Check

on:
  workflow_call:
    inputs:
      release:
        description: Validate the tag and changelog before release checks.
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  # Called workflows inherit the caller's name; keep this distinct from Release's group.
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # This lane costs about a minute. The cap is the standing rule that a check lane may
    # never exceed five minutes, made mechanical instead of aspirational, and it leaves the
    # required headroom over the real cost. Without it the runner default is six hours, so
    # anything that wedges burns a job slot for a working day and reports nothing useful.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      # Tests spawn the CLI under `node`, and the CLI refuses trusted publishing
      # below Node 22.14.0. The runner default is older, which made every
      # provenance test abort on the version guard instead of the behaviour under
      # test. `.tool-versions` is the one place both versions are declared, and
      # asdf reads it too, so a developer's shell runs what CI runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - if: inputs.release
        run: bun scripts/release.ts preflight
      - run: bun run check
      # Keep network-dependent advisory lookup out of the ordinary local feedback loop.
      - run: bun audit

  # `engines.node` promises consumers a floor that nothing else here can check. `.tool-versions`
  # pins one Node for developers and every other lane, so without this job the floor is only ever
  # asserted.
  #
  # Do not replace this with a types pin. Making `@types/node` match the floor looks like it would
  # turn the compiler into the gate, and does not: measured 2026-09-13, `@types/node@22.20.2`
  # declares `process.execve` (`process.d.ts:1976`), which no Node before v23.11.0 has. The types
  # major tracks the DefinitelyTyped line, never a runtime API surface, so it cannot answer this
  # question and a pin would only cost contributors newer types for nothing.
  #
  # Runs the shipped CLI rather than the repository checks: formatting and types do not execute,
  # so only build, suite and self-application can meet an API this floor lacks.
  #
  # What it covers is exactly what `engines` promises and no more. Vitest is hosted by Bun, so
  # this proves `dist/cli.js` runs on the floor — the tests spawn it under `node` — not that the
  # sources run on it when some other runtime imports them. Consumers only ever execute the CLI.
  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # `engines.node` is the only place the floor is declared, so read it instead of repeating
      # it. A second copy here would drift in silence the day someone raises the promise: this
      # job would keep testing the old version and keep reporting green, which is worse than no
      # job at all. Exits non-zero if the field is gone rather than testing whatever Node the
      # runner defaults to. The major alone is enough — setup-node resolves it to the newest
      # matching release, which also clears the 22.14.0 floor trusted publishing needs.
      - id: floor
        run: |
          bun -e 'const r=(await Bun.file("package.json").json()).engines?.node; const m=r?.match(/\d+/); if(!m){console.error("package.json has no engines.node to derive a floor from");process.exit(1)} console.log(`version=${m[0]}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.floor.outputs.version }}
          package-manager-cache: false
      # Proves the floor actually took effect. An empty or wrong version expression leaves the
      # runner's own Node in place, and every step below would still pass — a job that reports
      # green while testing a version nobody asked for is worse than no job, because it reads
      # as evidence. Runs before any work so the failure is immediate and unambiguous.
      - name: Confirm Node matches the declared floor
        run: |
          want='${{ steps.floor.outputs.version }}'
          have="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$want" != "$have" ]; then
            echo "::error::engines.node asks for Node $want, runner has $have. setup-node did not apply the derived floor, so this job proves nothing."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:built
      - run: bun run cleaned-artifact:check

  # Windows is the one platform where this tool's spawning differs, because `pnpm` and `npm`
  # there are `.cmd` shims that `execFile` cannot launch at all (see src/command.ts). That
  # branch cannot be proved by any test on Linux or macOS, and an unverified branch claiming
  # a supported platform is worse than declaring the platform unsupported.
  #
  # Runs the WHOLE suite, not a hand-picked subset. Most of it is platform-neutral, and the value
  # is in the parts that are not — those are exactly where Windows breaks. A case that genuinely
  # cannot run here skips ITSELF (`itPosix` in test/cli.test.ts, for `#!/bin/sh` shims and POSIX
  # process groups) instead of being excluded by filename here, so a new test gets Windows
  # coverage by default and the reason lives beside the test. The dry-run then drives the real
  # npm/pnpm shims and the whole artifact pipeline.
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      # pnpm comes from this repo's devDependencies, so the same version resolves here as in
      # every other lane, rather than whatever the runner happens to carry. Set BEFORE the tests:
      # the CLI cases spawn the packer, so an unset PATH makes them fail as a missing tool.
      - run: echo "${{ github.workspace }}\node_modules\.bin" >> $env:GITHUB_PATH
      - run: bun run test:built
      - run: node dist/cli.js --dry-run
