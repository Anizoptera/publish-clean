name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # This lane costs about a minute. The cap is the standing rule that a check lane may
    # never exceed five minutes, made mechanical instead of aspirational, and it leaves the
    # required headroom over the real cost. Without it the runner default is six hours, so
    # anything that wedges burns a job slot for a working day and reports nothing useful.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: latest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Tests spawn the CLI under `node`, and the CLI refuses trusted publishing
      # below Node 22.14.0. The runner default is older, which made every
      # provenance test abort on the version guard instead of the behaviour under
      # test. Pinned to the same major as release.yml so checks and publishes
      # exercise one runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun run check
